        .table-scroll {

<script>
// ---------- UTILS ----------
function $(id) { return document.getElementById(id); }

function startApp() {
    setTimeout(() => {
        $('splash').style.display = 'none';
        $('mainApp').style.display = 'block';
    }, 1200);

    updateStartAmount();
}

function updateStartAmount() {
    const inDep = parseFloat($('inDeposit').value) || 0;
    const bonusVal = parseFloat($('bonus').value) || 0;
    $('startAmount').value = (inDep + bonusVal).toFixed(2);
}

['inDeposit','bonus'].forEach(id => {
    $(id).addEventListener('input', updateStartAmount);
});

// ---------- MAIN CALCULATIONS ----------

function calculateProfitUntil() {
    const profitRate = parseFloat($('profitRate').value) || 0;
    const startDateStr = $('startDate').value;
    const calcUntilStr = $('calcUntil').value;
    const inDeposit = parseFloat($('inDeposit').value) || 0;
    const exDeposit = parseFloat($('exDeposit').value) || 0;
    const bonus = parseFloat($('bonus').value) || 0;
    const bonusSignal = parseFloat($('bonusSignal').value) || 0;
    const rateUSDC = parseFloat($('rateUSDC').value) || 0.85;
    const targetProfit = parseFloat($('targetProfit').value) || 0;

    if (!startDateStr || !calcUntilStr) {
        $('futureResult').textContent = 'Δώσε ημερομηνία έναρξης και ημερομηνία μέχρι τον υπολογισμό.';
        return;
    }

    const start = new Date(startDateStr);
    const end = new Date(calcUntilStr);
    if (end < start) {
        $('futureResult').textContent = 'Η ημερομηνία “μέχρι” πρέπει να είναι μετά την ημερομηνία έναρξης.';
        return;
    }

    const hits = [
        parseInt($('day1').value, 10) || 0,
        parseInt($('day2').value, 10) || 0,
        parseInt($('day3').value, 10) || 0,
        parseInt($('day4').value, 10) || 0,
        parseInt($('day5').value, 10) || 0,
        parseInt($('day6').value, 10) || 0,
        parseInt($('day7').value, 10) || 0
    ];

    let balance = inDeposit + bonus;
    let totalProfitUSD = 0;
    let dayCounter = 0;
    const oneDay = 24 * 60 * 60 * 1000;

    for (let d = new Date(start); d <= end; d = new Date(d.getTime() + oneDay)) {
        const weekday = d.getDay();
        let idx = weekday === 0 ? 6 : weekday - 1;
        const dailyHits = hits[idx];

        if (dailyHits > 0) {
            const factor = 1 + profitRate / 100;
            const newBalance = balance * Math.pow(factor, dailyHits);
            const profitToday = newBalance - balance;
            totalProfitUSD += profitToday;
            balance = newBalance;
        }

        dayCounter++;
    }

    const finalBalanceEUR = balance * rateUSDC;

    $('wAmount').value = balance.toFixed(2);

    let text = `Ημέρες: ${dayCounter}
`;
    text += `Τελικό υπόλοιπο (USD): ${balance.toFixed(2)} $
`;
    text += `Τελικό υπόλοιπο (EUR): ${finalBalanceEUR.toFixed(2)} €
`;
    text += `Συνολικό κέρδος (USD): ${totalProfitUSD.toFixed(2)} $
`;
    text += `Συνολικό κέρδος (EUR): ${(totalProfitUSD * rateUSDC).toFixed(2)} €
`;
    text += `
Σημείωση: Η κράτηση 5% υπολογίζεται μόνο στο ποσό ανάληψης.
`;

    if (targetProfit > 0) {
        if (totalProfitUSD * rateUSDC >= targetProfit) {
            text += `
Στόχος ${targetProfit} € ΕΠΙΤΕΥΧΘΗΚΕ.
`;
        } else {
            text += `
Στόχος ${targetProfit} € ΔΕΝ επιτεύχθηκε (έλλειψη: ${(targetProfit - totalProfitUSD * rateUSDC).toFixed(2)} €).
`;
        }
    }

    $('futureResult').textContent = text;
}

function generateTable() {
    const profitRate = parseFloat($('profitRate').value) || 0;
    const startDateStr = $('startDate').value;
    const inDeposit = parseFloat($('inDeposit').value) || 0;
    const exDeposit = parseFloat($('exDeposit').value) || 0;
    const bonus = parseFloat($('bonus').value) || 0;
    const rateUSDC = parseFloat($('rateUSDC').value) || 0.85;

    if (!startDateStr) {
        $('results').textContent = 'Δώσε ημερομηνία έναρξης.';
        return;
    }

    const hits = [
        parseInt($('day1').value, 10) || 0,
        parseInt($('day2').value, 10) || 0,
        parseInt($('day3').value, 10) || 0,
        parseInt($('day4').value, 10) || 0,
        parseInt($('day5').value, 10) || 0,
        parseInt($('day6').value, 10) || 0,
        parseInt($('day7').value, 10) || 0
    ];

    let balance = inDeposit + bonus;
    const start = new Date(startDateStr);
    const oneDay = 24 * 60 * 60 * 1000;
    let html = '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
    html += '<tr>' +
            '<th style="border:1px solid #ccc;padding:4px;">#</th>' +
            '<th style="border:1px solid #ccc;padding:4px;">Ημερομηνία</th>' +
            '<th style="border:1px solid #ccc;padding:4px;">Χτυπήματα</th>' +
            '<th style="border:1px solid #ccc;padding:4px;">Υπόλοιπο πριν (USD)</th>' +
            '<th style="border:1px solid #ccc;padding:4px;">Υπόλοιπο μετά (USD)</th>' +
            '<th style="border:1px solid #ccc;padding:4px;">Κέρδος ημέρας (USD)</th>' +
            '<th style="border:1px solid #ccc;padding:4px;">Κέρδος ημέρας (EUR)</th>' +
            '</tr>';

    let dayCounter = 0;
    let totalProfitUSD = 0;

    for (let i = 0; i < 30; i++) {
        const d = new Date(start.getTime() + i * oneDay);
        const weekday = d.getDay();
        let idx = weekday === 0 ? 6 : weekday - 1;
        const dailyHits = hits[idx];

        if (dailyHits > 0) {
            const factor = 1 + profitRate / 100;
            const before = balance;
            const after = balance * Math.pow(factor, dailyHits);
            const profitDayUSD = after - before;
            const profitDayEUR = profitDayUSD * rateUSDC;
            totalProfitUSD += profitDayUSD;
            balance = after;

            const dateStr = d.toLocaleDateString('el-GR');
            html += '<tr>' +
                    `<td style="border:1px solid #ccc;padding:4px;text-align:center;">${dayCounter + 1}</td>` +
                    `<td style="border:1px solid #ccc;padding:4px;text-align:center;">${dateStr}</td>` +
                    `<td style="border:1px solid #ccc;padding:4px;text-align:center;">${dailyHits}</td>` +
                    `<td style="border:1px solid #ccc;padding:4px;text-align:right;">${before.toFixed(2)}</td>` +
                    `<td style="border:1px solid #ccc;padding:4px;text-align:right;">${after.toFixed(2)}</td>` +
                    `<td style="border:1px solid #ccc;padding:4px;text-align:right;">${profitDayUSD.toFixed(2)}</td>` +
                    `<td style="border:1px solid #ccc;padding:4px;text-align:right;">${profitDayEUR.toFixed(2)}</td>` +
                    '</tr>';

            dayCounter++;
        }
    }

    html += '</table>';
    html += `<p>Συνολικές ημέρες με παίξιμο: ${dayCounter}<br>` +
            `Συνολικό κέρδος (USD): ${totalProfitUSD.toFixed(2)} $<br>` +
            `Συνολικό κέρδος (EUR): ${(totalProfitUSD * rateUSDC).toFixed(2)} €</p>`;

    $('results').innerHTML = html;
}

// ---------- FORM 2 (Μακροχρόνιο Πλάνο) ----------

function openForm2() {
    $('mainApp').style.display = 'none';
    $('form2').style.display = 'block';

    $('profitRate_display').textContent = ($('profitRate').value || 0) + ' %';
    $('rateUSDC_display').textContent = $('rateUSDC').value || 0.85;

    const rowsContainer = $('rows');
    rowsContainer.innerHTML = '';
    for (let i = 2; i <= 10; i++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${i}</td>
            <td><input id="p${i}" type="number" value="2" min="1"></td>
            <td><input id="a${i}" type="date"></td>
            <td><input id="b${i}" type="date"></td>
            <td><input id="c${i}" type="number" step="0.01"></td>
            <td id="d${i}"></td>
            <td><input id="w${i}" type="number" step="0.01"></td>
            <td id="net${i}"></td>
            <td id="r${i}"></td>
            <td id="days${i}"></td>
        `;
        rowsContainer.appendChild(tr);
    }
}

function backToMain() {
    $('form2').style.display = 'none';
    $('mainApp').style.display = 'block';
}

function run10() {
    const profitRate = parseFloat($('profitRate').value) || 0;
    const rateUSDC = parseFloat($('rateUSDC').value) || 0.85;

    processRow(1, profitRate, rateUSDC);

    for (let i = 2; i <= 10; i++) {
        const prevRemainingId = 'r' + (i - 1);
        const cInput = $('c' + i);
        if (!cInput.value) {
            const prevRemaining = parseFloat($(prevRemainingId).textContent) || 0;
            cInput.value = prevRemaining.toFixed(2);
        }
        processRow(i, profitRate, rateUSDC);
    }
}

function processRow(row, profitRate, rateUSDC) {
    const playsPerDay = parseFloat($('p' + row).value) || 1;
    const startStr = $('a' + row).value;
    const endStr = $('b' + row).value;
    const startAmount = parseFloat($('c' + row).value) || 0;
    const withdrawal = parseFloat($('w' + row).value) || 0;

    if (!startStr || !endStr) {
        $('d' + row).textContent = '';
        $('net' + row).textContent = '';
        $('r' + row).textContent = '';
        $('days' + row).textContent = '';
        return;
    }

    const start = new Date(startStr);
    const end = new Date(endStr);
    if (end < start) {
        $('d' + row).textContent = 'Λάθος ημερομηνίες';
        $('net' + row).textContent = '';
        $('r' + row).textContent = '';
        $('days' + row).textContent = '';
        return;
    }

    const oneDay = 24 * 60 * 60 * 1000;
    let balance = startAmount;
    let daysCount = 0;

    for (let d = new Date(start); d <= end; d = new Date(d.getTime() + oneDay)) {
        const factor = 1 + profitRate / 100;
        const newBalance = balance * Math.pow(factor, playsPerDay);
        balance = newBalance;
        daysCount++;
    }

    const finalUSD = balance;
    const grossProfitUSD = finalUSD - startAmount;

    // Κράτηση 5% μόνο στο ποσό ανάληψης
    const feeRate = 0.05;
    const feeOnWithdrawalUSD = withdrawal * feeRate;
    const netProfitAfterFeeUSD = grossProfitUSD - feeOnWithdrawalUSD;
    const netEUR = netProfitAfterFeeUSD * rateUSDC;

    const remainingAfterWithdrawal = finalUSD - withdrawal;

    $('d' + row
